name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # required to publish a release

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: digital-product-factory-windows
          path: target/release/dpf.exe

      # Publishing a release on a version tag gives a PERMANENT PUBLIC download URL.
      #
      # Actions artifacts are the wrong tool for a customer link: they expire after 90 days and
      # downloading one requires a GitHub login. A release asset needs neither, so this is what
      # gets handed to a buyer.
      #
      # The two .bat launchers ship WITH the exe because the renderer back end cannot be chosen
      # automatically: some integrated GPUs render a black window under OpenGL/Glow, others under
      # wgpu/DirectX, the app cannot detect which, and winit forbids retrying the other back end
      # inside one process (only one EventLoop per process). So the buyer gets a double-clickable
      # way to switch instead of a command line. Whatever fails, dpf.exe writes dpf-startup.log
      # beside itself, which names the back end and the reason.
      - name: Assemble the download folder
        shell: pwsh
        # Everything a buyer needs goes into ONE folder, then that folder is zipped, so the
        # download is a single file and everything arrives together. This matters because the
        # .bat launchers are useless away from dpf.exe - they resolve it relative to themselves
        # (%~dp0). Shipping three separate release assets made "put them in the same folder"
        # the buyer's problem, which is one support ticket per confused customer.
        run: |
          New-Item -ItemType Directory -Force -Path staging/DigitalProductFactory | Out-Null
          Copy-Item target/release/dpf.exe        staging/DigitalProductFactory/
          Copy-Item dist/dpf-glow.bat             staging/DigitalProductFactory/
          Copy-Item dist/dpf-wgpu.bat             staging/DigitalProductFactory/
          Copy-Item dist/START-HERE.txt           staging/DigitalProductFactory/
          # feature_tiers.json MUST ship, because it is the upgrade gate AND holds the
          # upgrade_url. Without it the app silently falls back to the compiled-in table, and
          # editing tiers or the sales link would need a full rebuild - which is exactly what
          # the file exists to avoid. It also means a tier change is a file edit, not a release.
          Copy-Item feature_tiers.json           staging/DigitalProductFactory/
          # The marketplace rules ship too: these are the Etsy/Gumroad/Shopify/Payhip limits the QC
          # check and the exporters enforce, and the Settings screen displays them. Without the file
          # the app writes its own defaults, but shipping it makes the rules visible and editable by
          # the user instead of only existing inside the binary.
          Copy-Item platform_formats.json        staging/DigitalProductFactory/
          # The brand asset set, for customers who want the icon for their own listing or site.
          Copy-Item assets/favicon               staging/DigitalProductFactory/ -Recurse -Force
          # A plain-English sheet for walking every module, so a fault can be reported precisely.
          Copy-Item MODULE-TEST-SHEET.md         staging/DigitalProductFactory/
          # The user guide ships with the app. The app is offline by design, so a guide that
          # only exists online is a guide the customer cannot read when they need it.
          Copy-Item GUIDE.md                     staging/DigitalProductFactory/
          Compress-Archive -Path staging/DigitalProductFactory `
                           -DestinationPath DigitalProductFactory-windows.zip -Force
          Write-Host "zip contents:"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead("$PWD/DigitalProductFactory-windows.zip").Entries |
            ForEach-Object { Write-Host ("  " + $_.FullName + "  " + $_.Length + " bytes") }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DigitalProductFactory-windows.zip
          generate_release_notes: true
          body: |
            Digital Product Factory — Windows build.

            **Download `DigitalProductFactory-windows.zip` and unzip it.** Everything you need is
            inside one folder — keep the files together, because the two launcher files have to
            sit next to the program to work.

            **Getting started**

            1. Run `dpf.exe`. No installer required.
            2. Add your AI key: Settings → paste a key from OpenAI, Anthropic, Google, DeepSeek or
               Moonshot. Only one is needed to start — you bring your own, the app never supplies one.
            3. If you have a licence key, open it with the 🔑 Licence button in the left sidebar.

            **If the window is black**

            A few graphics drivers draw this app as a blank window on one of the two drawing
            back ends. It is a driver quirk, not a fault in your copy, and the fix is a double-click:

            * `dpf-glow.bat` — run with OpenGL
            * `dpf-wgpu.bat` — run with DirectX

            If one is black, the other normally works. Either way `dpf.exe` writes
            **`dpf-startup.log`** into the same folder — that file names the back end that failed
            and why, and is the single most useful thing to send to support.
