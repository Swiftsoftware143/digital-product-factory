name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # required to publish a release

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: digital-product-factory-windows
          path: target/release/dpf.exe

      # Publishing a release on a version tag gives a PERMANENT PUBLIC download URL.
      #
      # Actions artifacts are the wrong tool for a customer link: they expire after 90 days and
      # downloading one requires a GitHub login. A release asset needs neither, so this is what
      # gets handed to a buyer.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/dpf.exe
          generate_release_notes: true
          body: |
            Digital Product Factory — Windows desktop build.

            Download `dpf.exe` below and run it. No installer required.

            Bring your own AI key: paste a key from OpenAI, Anthropic, Google, DeepSeek or
            Moonshot in Settings (only one is needed to start).
